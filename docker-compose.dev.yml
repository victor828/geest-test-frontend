services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: geest-test-frontend:dev
    ports:
      - "${DEV_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://geest.veom.lat}
    volumes:
      - .:/app
      - /app/node_modules
