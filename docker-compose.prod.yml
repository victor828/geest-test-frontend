services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://geest.veom.lat}
    image: geest-test-frontend:prod
    ports:
      - "${PROD_PORT:-3501}:${PORT:-8080}"
    environment:
      PORT: ${PORT:-3501}
    restart: unless-stopped
