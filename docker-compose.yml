services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: geest-test-frontend:dev
    ports:
      - "${DEV_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://geest.veom.lat}
    volumes:
      - .:/app
      - /app/node_modules
    profiles:
      - dev

  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://geest.veom.lat}
    image: geest-test-frontend:prod
    ports:
      - "${PROD_PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: ${PORT:-8080}
    profiles:
      - prod
